# Generate the Xcode project with: brew install xcodegen && xcodegen generate
name: LearningDashboard
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
targets:
  LearningDashboard:
    type: application
    platform: iOS
    sources:
      - LearningDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LearningDashboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Learning Dashboard
    scheme:
      testTargets:
        - LearningDashboardTests
  LearningDashboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/LearningDashboardTests
    dependencies:
      - target: LearningDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LearningDashboardTests
        GENERATE_INFOPLIST_FILE: YES
